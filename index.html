<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZipView</title>
    <link rel="icon" type="image/png" href="./assets/Zip_Icon.png" />
    <link rel="stylesheet" href="./styles.css?v=apple-31" />
    <script src="https://cdn.jsdelivr.net/npm/occt-import-js@0.0.15/dist/occt-import-js.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="toolbar">
        <div class="brand-lockup">
          <button
            id="bom-menu-button"
            class="toolbar-menu-button"
            type="button"
            aria-pressed="false"
            aria-controls="bom-panel"
            aria-label="Open BOM sidebar"
            hidden
          >
            <span aria-hidden="true"></span>
            <span aria-hidden="true"></span>
            <span aria-hidden="true"></span>
          </button>
          <button id="home-button" class="brand-badge" type="button">
            <img src="./assets/Zip_Icon.png" alt="" class="brand-icon" />
            <span>ZipView</span>
          </button>
          <span id="status-text" class="status-text">Loading model...</span>
        </div>

        <div class="toolbar-actions">
          <button id="theme-button" class="toolbar-icon-button" type="button" aria-pressed="false" aria-label="Toggle dark mode">☀</button>
          <button id="reload-model-button" class="toolbar-icon-button" type="button" aria-label="Reload model">↻</button>
          <button id="reset-view-button" type="button">Reset View</button>
          <button id="transparency-button" type="button" aria-pressed="false">Xray</button>
        </div>
      </header>

      <main class="viewer-stage">
        <aside id="bom-panel" class="bom-panel" aria-label="Bill of materials" hidden>
          <div
            id="bom-resize-handle"
            class="bom-resize-handle"
            role="separator"
            aria-orientation="vertical"
            aria-label="Resize catalog"
            tabindex="0"
          ></div>
          <div class="bom-panel-shell">
            <div class="bom-panel-header">
              <div>
                <div class="bom-title">Catalog</div>
              </div>
              <button id="bom-collapse-button" class="bom-collapse-button" type="button">
                Collapse All
              </button>
            </div>

            <label class="bom-search-shell" for="bom-search">
              <input id="bom-search" type="search" placeholder="Find a part..." autocomplete="off" />
            </label>

            <div id="bom-empty" class="bom-empty" hidden>No matching parts.</div>
            <div id="bom-list" class="bom-list" aria-label="Model parts"></div>
          </div>
        </aside>
        <canvas id="viewer-canvas"></canvas>
        <div id="part-context-menu" class="part-context-menu" hidden>
          <div id="part-context-title" class="part-context-title"></div>
          <button id="context-isolate-button" class="part-context-action" type="button">Isolate Part</button>
          <button id="context-hide-button" class="part-context-action" type="button">Hide Part</button>
        </div>
        <section id="model-picker" class="model-picker" aria-label="Model picker">
          <div class="model-picker-shell">
            <div class="model-picker-header">
              <div class="model-picker-title">ZipView</div>
            </div>

            <div class="model-picker-grid">
              <button
                class="model-card"
                type="button"
                aria-label="Open Zip model"
                data-model-path="./assets/models/50000-000_A01_1-placeholder.obj"
                data-fallback-model-path="./assets/models/F18.stl"
                data-model-name="Zip"
              >
                <img src="./assets/Zip_Render.png" alt="Zip model" />
                <span class="model-card-label">
                  <span class="model-card-title-line">
                    <span class="model-card-title">Aircraft</span>
                    <span class="model-card-subtitle model-card-subtitle-inline">EV4</span>
                  </span>
                </span>
              </button>
              <button
                class="model-card"
                type="button"
                aria-label="Open Droid model"
                data-model-path="./assets/models/Droid_Export_Attempt_8.obj"
                data-fallback-model-path="./assets/models/Droid_Export_Attempt_8.obj"
                data-model-name="Droid"
              >
                <img src="./assets/Droid_Render.png" alt="Droid model" />
                <span class="model-card-label">
                  <span class="model-card-title-line">
                    <span class="model-card-title">Droid</span>
                    <span class="model-card-subtitle model-card-subtitle-inline">EV3</span>
                  </span>
                </span>
              </button>
              <button
                class="model-card model-card-placeholder"
                type="button"
                aria-label="Open Dock model"
                data-model-path="./assets/models/DOCK_EV4_Export_Attempt_1.obj"
                data-fallback-model-path="./assets/models/DOCK_EV4_Export_Attempt_1.obj"
                data-model-name="Dock"
              >
                <img src="./assets/Dock.png"/>
                <span class="model-card-label">
                  <span class="model-card-title-line">
                    <span class="model-card-title">Dock</span>
                    <span class="model-card-subtitle model-card-subtitle-inline">EV4</span>
                  </span>
                </span>
              </button>
              <button
                class="model-card model-card-placeholder"
                type="button"
                aria-label="Zipping Point model placeholder"
                aria-disabled="true"
                data-disabled="true"
                data-model-name="Zipping Point"
              >
                <span class="model-card-label">
                  <span class="model-card-title">Zipping Point</span>
                  <span class="model-card-subtitle">lmao</span>
                </span>
              </button>
            </div>
          </div>
        </section>
        <div id="loading-screen" class="loading-screen" aria-live="polite">
          <div class="loading-mark">
            <div class="loading-wordmark">ZipView</div>
            <div id="loading-label" class="loading-label">Loading model...</div>
            <div class="loading-spinner" aria-hidden="true"></div>
          </div>
        </div>
        <div id="part-tooltip" class="part-tooltip" hidden></div>
      </main>
    </div>

    <script type="module" src="./src/app.js?v=apple-37"></script>
  </body>
</html>
