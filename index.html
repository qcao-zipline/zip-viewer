<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZipView</title>
    <link rel="stylesheet" href="./styles.css?v=apple-10" />
    <script src="https://cdn.jsdelivr.net/npm/occt-import-js@0.0.15/dist/occt-import-js.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="toolbar">
        <div class="brand-lockup">
          <button
            id="bom-menu-button"
            class="toolbar-menu-button"
            type="button"
            aria-pressed="false"
            aria-controls="bom-panel"
            aria-label="Open BOM sidebar"
            hidden
          >
            <span aria-hidden="true"></span>
            <span aria-hidden="true"></span>
            <span aria-hidden="true"></span>
          </button>
          <button id="home-button" class="brand-badge" type="button">ZipView</button>
          <span id="status-text" class="status-text">Loading model...</span>
        </div>

        <div class="toolbar-actions">
          <button id="theme-button" type="button" aria-pressed="false" aria-label="Toggle dark mode">Dark</button>
          <button id="reload-model-button" type="button">Reload</button>
          <button id="reset-view-button" type="button">Reset View</button>
          <button id="transparency-button" type="button" aria-pressed="false">Transparent</button>
        </div>
      </header>

      <main class="viewer-stage">
        <aside id="bom-panel" class="bom-panel" aria-label="Bill of materials" hidden>
          <div class="bom-panel-shell">
            <div class="bom-panel-header">
              <div>
                <div class="bom-title">Catalog</div>
              </div>
            </div>

            <label class="bom-search-shell" for="bom-search">
              <input id="bom-search" type="search" placeholder="Find a part..." autocomplete="off" />
            </label>

            <div id="bom-empty" class="bom-empty" hidden>No matching parts.</div>
            <div id="bom-list" class="bom-list" role="listbox" aria-label="Model parts"></div>
          </div>
        </aside>
        <canvas id="viewer-canvas"></canvas>
        <section id="model-picker" class="model-picker" aria-label="Model picker">
          <div class="model-picker-shell">
            <div class="model-picker-header">
              <div class="model-picker-title">ZipView</div>
            </div>

            <div class="model-picker-grid">
              <button
                class="model-card"
                type="button"
                data-model-path="./assets/models/demo.step"
                data-fallback-model-path="./assets/models/demo.step"
                data-model-name="Zip"
              >
                <img src="./assets/Zip.png" alt="Zip model" />
                <span class="model-card-label">Zip</span>
              </button>
              <button
                class="model-card"
                type="button"
                data-model-path="./assets/models/Droid_Export_Attempt_8.obj"
                data-fallback-model-path="./assets/models/Droid_Export_Attempt_8.obj"
                data-model-name="Droid"
              >
                <img src="./assets/Droid.png" alt="Droid model" />
                <span class="model-card-label">Droid</span>
              </button>
            </div>
          </div>
        </section>
        <div id="loading-screen" class="loading-screen" aria-live="polite">
          <div class="loading-mark">
            <div class="loading-wordmark">ZipView</div>
            <div id="loading-label" class="loading-label">Loading model...</div>
            <div class="loading-spinner" aria-hidden="true"></div>
          </div>
        </div>
        <div id="part-tooltip" class="part-tooltip" hidden></div>
      </main>
    </div>

    <script type="module" src="./src/app.js?v=apple-9"></script>
  </body>
</html>
